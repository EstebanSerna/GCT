name: Deploy GCT por SSH

# Se ejecuta automáticamente cada vez que hay un push a "main".
# También se puede lanzar manualmente desde la pestaña "Actions" en GitHub.
#
# Se sube con rsync por SSH usando una llave dedicada a este despliegue
# (secreto SSH_PRIVATE_KEY), sin contraseñas. La huella del servidor está
# fijada abajo: si algún día cambia, el despliegue se detiene en vez de
# confiar a ciegas en otro servidor.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  SSH_HOST: ssh.hostcarriel.com
  SSH_USER: gct.com.co
  # Huella pública ED25519 del servidor de HostCarriel (no es un secreto).
  SSH_HOST_FINGERPRINT: "SHA256:3oOALmFXzXtrWae4pbQoZM1eLxTccrGYUG54/H3b6gA"

jobs:
  ssh-deploy:
    name: Compilar y subir el sitio
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar para producción
        run: npm run build
        env:
          # URLs públicas del backend en Railway — no son secretas, son las
          # mismas con las que cualquiera puede hablarle desde el navegador.
          VITE_CHAT_API_URL: https://api.gct.com.co/api/chat
          VITE_API_BASE_URL: https://api.gct.com.co

      - name: Preparar la conexión SSH (llave + verificación del servidor)
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "::error::Falta el secreto SSH_PRIVATE_KEY (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          install -d -m 700 ~/.ssh
          # Al pegar desde Windows la llave puede traer saltos de línea CRLF,
          # que OpenSSH en Linux rechaza: se quitan antes de guardarla.
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if ! KEYERR=$(ssh-keygen -y -f ~/.ssh/deploy_key 2>&1 >/dev/null); then
            echo "::error::La llave SSH guardada en el secreto no es válida: $(echo "$KEYERR" | tr '\n' ' ' | cut -c1-200)"
            exit 1
          fi
          ssh-keyscan -t ed25519 "$SSH_HOST" > ~/.ssh/known_hosts 2>/dev/null
          ACTUAL=$(ssh-keygen -lf ~/.ssh/known_hosts | awk '{print $2}')
          if [ "$ACTUAL" != "$SSH_HOST_FINGERPRINT" ]; then
            echo "::error::La huella del servidor no coincide (recibida: $ACTUAL). Despliegue detenido."
            exit 1
          fi

      - name: Subir el sitio con rsync
        run: |
          SSH="ssh -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o ServerAliveInterval=30 -o ConnectTimeout=30"
          OPTS="-rlz --omit-dir-times --chmod=D755,F644 -e"
          # Prueba corta antes de subir: si falla, el motivo exacto queda
          # visible en el resumen del error (no contiene secretos).
          if ! PRUEBA=$($SSH "$SSH_USER@$SSH_HOST" "echo conectado" 2>&1); then
            echo "::error::No se pudo entrar por SSH: $(echo "$PRUEBA" | tr '\n' ' ' | cut -c1-300)"
            exit 1
          fi
          # 1) Primero los archivos con nombre único (assets), para que el
          #    sitio nunca apunte a archivos que todavía no existen.
          rsync $OPTS "$SSH" dist/assets/ "$SSH_USER@$SSH_HOST:public_html/assets/"
          # 2) Después todo lo demás, incluido index.html que enlaza a lo anterior.
          rsync $OPTS "$SSH" --exclude='/assets/' dist/ "$SSH_USER@$SSH_HOST:public_html/"
          echo "Sitio publicado."
